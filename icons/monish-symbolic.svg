<!--
  Symbolic SVG icon for the Monish panel indicator.
  Uses currentColor so GNOME Shell can recolour it to match the panel theme.
  Designed at 16×16; GNOME scales it to the actual panel icon size.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     height="16" width="16" viewBox="0 0 16 16">
  <style>
    * {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
  <!-- Monitor bezel -->
  <rect x="1" y="1.5" width="14" height="9" rx="1.5"/>
  <!-- Monitor stand neck -->
  <line x1="8" y1="10.5" x2="8" y2="13.5"/>
  <!-- Monitor stand base -->
  <line x1="5" y1="13.5" x2="11" y2="13.5"/>
  <!-- Mini bar-chart inside the screen (represents monitoring) -->
  <line x1="3.5" y1="8" x2="3.5" y2="6"/>
  <line x1="5.5" y1="8" x2="5.5" y2="4.5"/>
  <line x1="7.5" y1="8" x2="7.5" y2="5.5"/>
  <line x1="9.5" y1="8" x2="9.5" y2="3.5"/>
  <line x1="11.5" y1="8" x2="11.5" y2="5"/>
</svg>
