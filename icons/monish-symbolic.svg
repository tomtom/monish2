<!--
  Symbolic SVG icon for the Monish panel indicator.
  Uses currentColor so GNOME Shell can recolour it to match the panel theme.
  Designed at 16x16; lighter bars use reduced opacity for visual contrast.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     height="16" width="16" viewBox="0 0 16 16">
  <rect fill="currentColor" opacity="0.4" x="1"  y="10" width="2" height="5"/>
  <rect fill="currentColor"               x="4"  y="5"  width="2" height="10"/>
  <rect fill="currentColor"               x="7"  y="2"  width="2" height="13"/>
  <rect fill="currentColor" opacity="0.4" x="10" y="7"  width="2" height="8"/>
  <rect fill="currentColor"               x="13" y="4"  width="2" height="11"/>
</svg>
